[project]
name = "blog-pknoll"
version = "0.0.0"
description = "Blog técnico estático"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "marimo>=0.25.2",
    "ruff",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# Formato do marimo: a saída da célula é a última expressão, e o marimo grava `return` no fim de cada célula.
"src/content/posts/*/notebooks/*.py" = ["B018", "PLR1711"]
