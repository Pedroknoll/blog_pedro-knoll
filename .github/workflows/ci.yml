name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Astro check
        run: pnpm astro check

      - name: Svelte check
        run: pnpm check:svelte

      - name: Worker check
        run: pnpm check:worker

      - name: Ruff
        run: uv sync --locked && uv run ruff check

      - name: Marimo check
        run: uv run marimo check --strict src/content/posts/*/notebooks/*.py

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Unit tests
        run: pnpm vitest run

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lighthouse-mode: ${{ steps.lighthouse-scope.outputs.mode }}
      lighthouse-posts: ${{ steps.lighthouse-scope.outputs.posts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # O diff do Lighthouse scope precisa da base do PR ou do push (T-86).
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # Só pastas de post publicado: o Lighthouse mede a home e esses posts.
      # Qualquer outra mudança, ou base não achada: mede tudo (T-86).
      - name: Lighthouse scope
        id: lighthouse-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/lighthouse-scope.mjs

      - name: Production build
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: No fixtures in production dist
        run: node scripts/check-no-fixtures.mjs

      - name: Fixture build
        run: SHOW_FIXTURES=true pnpm build --outDir dist-fixtures
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

      - name: Upload dist-fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-fixtures
          path: dist-fixtures

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download dist-fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-fixtures
          path: dist

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  api:
    name: api
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download dist-fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-fixtures
          path: dist

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: API tests
        run: pnpm exec playwright test -c playwright.api.config.ts

  lighthouse:
    name: lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Lighthouse
        run: pnpm exec lhci autorun
        env:
          LIGHTHOUSE_MODE: ${{ needs.build.outputs.lighthouse-mode }}
          LIGHTHOUSE_POSTS: ${{ needs.build.outputs.lighthouse-posts }}

      - name: Upload Lighthouse report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: lhci-report/
          retention-days: 14

  # O job sempre roda, para o deploy não ficar skipped; no modo posts, o
  # passo do Lighthouse é que fica de fora (T-86).
  lighthouse-fixtures:
    name: lighthouse-fixtures
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        if: ${{ needs.build.outputs.lighthouse-mode != 'posts' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        if: ${{ needs.build.outputs.lighthouse-mode != 'posts' }}
        uses: ./.github/actions/setup

      - name: Download dist-fixtures
        if: ${{ needs.build.outputs.lighthouse-mode != 'posts' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-fixtures
          path: dist-fixtures

      - name: Lighthouse fixtures
        if: ${{ needs.build.outputs.lighthouse-mode != 'posts' }}
        run: pnpm exec lhci autorun
        env:
          LIGHTHOUSE_SCOPE: fixtures
          LIGHTHOUSE_DIST: dist-fixtures

      - name: Skipped in posts mode
        if: ${{ needs.build.outputs.lighthouse-mode == 'posts' }}
        run: echo "Só pastas de post publicado no diff; as fixtures não mudaram."

      - name: Upload Lighthouse report
        if: ${{ !cancelled() && needs.build.outputs.lighthouse-mode != 'posts' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report-fixtures
          path: lhci-report/
          retention-days: 14

  artifact-checks:
    name: artifact-checks
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Download dist-fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-fixtures
          path: dist-fixtures

      - name: Links
        if: ${{ !cancelled() }}
        run: pnpm check:links

      - name: JavaScript per page
        if: ${{ !cancelled() }}
        run: pnpm check:js

      - name: SVG figures
        if: ${{ !cancelled() }}
        run: pnpm check:svg

      - name: Links in dist-fixtures
        if: ${{ !cancelled() }}
        run: pnpm exec linkinator ./dist-fixtures

      - name: JavaScript per page in dist-fixtures
        if: ${{ !cancelled() }}
        run: node scripts/check-page-js.mjs dist-fixtures

      - name: SVG figures in dist-fixtures
        if: ${{ !cancelled() }}
        run: node scripts/check-svg.mjs dist-fixtures

  preview:
    name: preview
    needs: [lint, test, build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build with drafts
        run: pnpm build
        env:
          SHOW_DRAFTS: "true"
          SITE_URL: ${{ vars.SITE_URL }}
          NOTEBOOK_REF: ${{ github.event.pull_request.head.sha }}

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER}" \
            2>&1 | tee wrangler-output.txt
          url=$(sed -n 's/.*Version Preview Alias URL:[[:space:]]*//p' wrangler-output.txt | head -n 1)
          url=${url%%$'\r'}
          if [ -z "${url}" ]; then
            echo "wrangler did not print a Version Preview Alias URL" >&2
            exit 1
          fi
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker="<!-- preview-url -->"
          body=$(printf '%s\nPreview: %s\n' "${marker}" "${PREVIEW_URL}")
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- preview-url -->"))) | .id')
          comment_id=$(printf '%s\n' "${ids}" | awk 'NF { print; exit }')
          if [ -n "${comment_id}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="${body}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}"
          fi

  deploy:
    name: deploy
    needs:
      [
        lint,
        test,
        build,
        e2e,
        lighthouse,
        lighthouse-fixtures,
        artifact-checks,
        api,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply blog-votes --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VOTE_IP_SALT: ${{ secrets.VOTE_IP_SALT }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          if [ -z "${VOTE_IP_SALT}" ]; then
            echo "VOTE_IP_SALT ausente" >&2
            exit 1
          fi
          secrets_file="${RUNNER_TEMP}/vote-ip-salt.json"
          umask 077
          trap 'rm -f "${secrets_file}"' EXIT
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(process.argv[1], JSON.stringify({ VOTE_IP_SALT: process.env.VOTE_IP_SALT }));' "${secrets_file}"
          pnpm exec wrangler deploy --no-autoconfig --secrets-file "${secrets_file}"
